<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Placeholder illustration of a health center exterior">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EAF4EB"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E8F5E9"/>
      <stop offset="1" stop-color="#D7E9D9"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F1F7F2"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F6FAF6"/>
      <stop offset="1" stop-color="#DCECDF"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#F9A825" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#F9A825" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#263238" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>
  <circle cx="1340" cy="180" r="190" fill="url(#glow)"/>
  <circle cx="1340" cy="180" r="82" fill="#FFF8E1" stroke="#F9A825" stroke-width="6"/>
  <path d="M0 690 Q400 640 800 690 T1600 690 V900 H0Z" fill="url(#ground)"/>
  <path d="M0 760 Q420 720 820 760 T1600 760 V900 H0Z" fill="#CFE4D2" opacity="0.7"/>

  <g transform="translate(300 250)" filter="url(#soft)">
    <rect x="0" y="110" width="1000" height="430" rx="12" fill="url(#wall)" stroke="#2E7D32" stroke-width="8"/>
    <rect x="-28" y="88" width="1056" height="34" rx="8" fill="#2E7D32"/>
    <rect x="60" y="180" width="170" height="150" rx="6" fill="url(#glass)" stroke="#2E7D32" stroke-width="5"/>
    <rect x="280" y="180" width="170" height="150" rx="6" fill="url(#glass)" stroke="#2E7D32" stroke-width="5"/>
    <rect x="550" y="180" width="170" height="150" rx="6" fill="url(#glass)" stroke="#2E7D32" stroke-width="5"/>
    <rect x="770" y="180" width="170" height="150" rx="6" fill="url(#glass)" stroke="#2E7D32" stroke-width="5"/>
    <path d="M145 180 V330 M365 180 V330 M635 180 V330 M855 180 V330" stroke="#2E7D32" stroke-width="4" opacity="0.8"/>
    <rect x="420" y="260" width="160" height="280" rx="8" fill="#F6FAF6" stroke="#2E7D32" stroke-width="8"/>
    <circle cx="550" cy="410" r="9" fill="#2E7D32"/>
    <rect x="250" y="420" width="140" height="28" rx="6" fill="#F9A825"/>
    <rect x="610" y="420" width="140" height="28" rx="6" fill="#F9A825"/>
  </g>

  <g fill="#2E7D32" opacity="0.94">
    <circle cx="170" cy="560" r="86"/>
    <circle cx="120" cy="620" r="70" opacity="0.82"/>
    <circle cx="225" cy="620" r="74" opacity="0.86"/>
    <rect x="158" y="620" width="24" height="120" fill="#1B5E20"/>
  </g>
  <g fill="#2E7D32" opacity="0.94">
    <circle cx="1430" cy="560" r="92"/>
    <circle cx="1375" cy="625" r="72" opacity="0.82"/>
    <circle cx="1485" cy="625" r="76" opacity="0.86"/>
    <rect x="1418" y="625" width="24" height="120" fill="#1B5E20"/>
  </g>

  <path d="M640 900 L720 540 H880 L960 900Z" fill="#FFFFFF" opacity="0.72"/>
  <path d="M720 540 H880" stroke="#2E7D32" stroke-width="6"/>
</svg>
